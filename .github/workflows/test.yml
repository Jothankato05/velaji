name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the MongoDB binary outside node_modules, which `npm ci` wipes.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      # Node 20 matches the production image (Dockerfile).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The tests run against a real in-memory MongoDB; keep its binary between runs.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
